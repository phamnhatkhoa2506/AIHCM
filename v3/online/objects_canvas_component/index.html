<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* 2026-08-15 (theo yeu cau nguoi dung "khong tu suy luan, custom 2 loai box: xanh la = OCR
     go tu do, vang = Object voi dropdown 514 nhan gan lien tren box") - HTML5 canvas + JS
     thuan (khong React/fabric.js), giao tiep Streamlit qua dung giao thuc postMessage noi bo.
     Toan bo component nam trong 1 iframe DUY NHAT nen overlay input/select tren canvas KHONG
     dinh bug cross-iframe. */
  html, body { margin: 0; padding: 0; background: transparent; font-family: system-ui, -apple-system, sans-serif; }
  #wrap { display: inline-block; }
  #modebar { display: flex; gap: 6px; margin-bottom: 6px; }
  .mode-btn {
    border: 2px solid transparent; border-radius: 6px; padding: 5px 12px; font: 600 12px system-ui, sans-serif;
    cursor: pointer; color: #111;
  }
  #modeOcr { background: #22c55e; }
  #modeObject { background: #f5c518; }
  .mode-btn.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.5); }
  .mode-btn.inactive { opacity: 0.45; }
  #stage {
    position: relative;
    background: #1c1c1e;
    border: 1px solid #3a3a3c;
    border-radius: 8px;
    overflow: hidden;
    cursor: crosshair;
    user-select: none;
  }
  #gridCanvas { display: block; }
  .box-editor {
    position: absolute;
    display: flex;
    gap: 3px;
    z-index: 10;
  }
  .box-edit-input {
    background: #2c2c2e; color: #4ade80;
    border: 1px solid #22c55e; border-radius: 4px;
    font: 600 12px/1.4 system-ui, sans-serif;
    padding: 2px 6px; outline: none;
  }
  .box-edit-select {
    background: #2c2c2e; color: #fde68a;
    border: 1px solid #f5c518; border-radius: 4px;
    font: 600 12px system-ui, sans-serif;
    padding: 2px 4px; outline: none; max-width: 200px;
  }
  .box-edit-count {
    background: #2c2c2e; color: #fde68a;
    border: 1px solid #f5c518; border-radius: 4px;
    font: 600 12px system-ui, sans-serif;
    padding: 2px 2px; outline: none; width: 34px; text-align: center;
  }
  .box-del {
    position: absolute;
    width: 16px; height: 16px;
    background: #d33; color: #fff;
    border-radius: 50%;
    font: 700 11px/16px system-ui, sans-serif;
    text-align: center;
    cursor: pointer;
    z-index: 9;
  }
  #toolbar { display: flex; gap: 8px; margin-top: 6px; align-items: center; flex-wrap: wrap; }
  #toolbar button {
    background: #2c2c2e; color: #eee; border: 1px solid #4a4a4c; border-radius: 5px;
    padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  #toolbar button:hover { background: #3a3a3c; }
  #hint { color: #999; font-size: 11px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="modebar">
    <button id="modeOcr" class="mode-btn" type="button">🟢 OCR (gõ chữ tự do)</button>
    <button id="modeObject" class="mode-btn" type="button">🟡 Object (chọn nhãn)</button>
  </div>
  <div id="stage">
    <canvas id="gridCanvas"></canvas>
  </div>
  <div id="toolbar">
    <button id="undoBtn" title="Hoàn tác khung cuối">↩ Hoàn tác</button>
    <button id="clearBtn" title="Xoá hết">🗑 Xoá hết</button>
    <span id="hint">Chọn chế độ ở trên rồi kéo chuột vẽ khung.</span>
  </div>
</div>
<script>
(function () {
  var W = 480, H = 270;
  var LABELS = [];  // 514 nhan tieng Viet (tu Python truyen sang, xem objects_canvas.py)
  // box: {x0,y0,x1,y1, kind:"ocr"|"object", text (ocr), label (object), minCount (object)}
  var boxes = [];
  var mode = "ocr";  // che do dang chon de VE KHUNG MOI - khong anh huong khung da co
  var initialized = false;
  var drawing = false, curBox = null;
  var stage = document.getElementById("stage");
  var canvas = document.getElementById("gridCanvas");
  var ctx = canvas.getContext("2d");
  var modeOcrBtn = document.getElementById("modeOcr");
  var modeObjectBtn = document.getElementById("modeObject");

  var COLOR = { ocr: "#22c55e", object: "#f5c518" };

  function sendToStreamlit(type, data) {
    var out = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(out, "*");
  }
  function componentReady() { sendToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
  function setFrameHeight() {
    var h = stage.getBoundingClientRect().height + document.getElementById("modebar").offsetHeight + 50;
    sendToStreamlit("streamlit:setFrameHeight", { height: Math.ceil(h) });
  }
  function emitValue() {
    sendToStreamlit("streamlit:setComponentValue", { value: boxes.map(function (b) {
      return {
        x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1, kind: b.kind,
        text: b.text || "", label: b.label || "", minCount: b.minCount || 1,
      };
    }) });
  }

  function resize() {
    canvas.width = W; canvas.height = H;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    stage.style.width = W + "px";
  }

  function updateModeButtons() {
    modeOcrBtn.className = "mode-btn " + (mode === "ocr" ? "active" : "inactive");
    modeObjectBtn.className = "mode-btn " + (mode === "object" ? "active" : "inactive");
  }

  function boxDisplayLabel(b) {
    if (b.kind === "ocr") return b.text || "";
    if (!b.label) return "";
    return b.minCount > 1 ? (b.label + " ×" + b.minCount) : b.label;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(255,255,255,0.06)";
    ctx.lineWidth = 1;
    for (var gx = 0; gx <= W; gx += 20) { ctx.beginPath(); ctx.moveTo(gx + 0.5, 0); ctx.lineTo(gx + 0.5, H); ctx.stroke(); }
    for (var gy = 0; gy <= H; gy += 20) { ctx.beginPath(); ctx.moveTo(0, gy + 0.5); ctx.lineTo(W, gy + 0.5); ctx.stroke(); }

    boxes.forEach(function (b, i) { drawBox(b, i); });
    if (curBox) drawBox(curBox, -1);

    syncOverlays();
  }

  function drawBox(b, idx) {
    var x = Math.min(b.x0, b.x1), y = Math.min(b.y0, b.y1);
    var w = Math.abs(b.x1 - b.x0), h = Math.abs(b.y1 - b.y0);
    var color = COLOR[b.kind] || COLOR.ocr;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    var text = boxDisplayLabel(b);
    if (text) {
      ctx.font = "600 12px system-ui, sans-serif";
      var icon = b.kind === "ocr" ? "🔤" : "🔲";
      var label = "#" + (idx + 1) + " " + icon + " " + text;
      var padX = 5;
      var tw = ctx.measureText(label).width + padX * 2;
      var chipY = y - 18 >= 0 ? y - 18 : y;
      ctx.fillStyle = color;
      ctx.fillRect(x, chipY, tw, 17);
      ctx.fillStyle = "#111";
      ctx.fillText(label, x + padX, chipY + 12);
    }
  }

  function syncOverlays() {
    var old = stage.querySelectorAll(".box-del");
    old.forEach(function (el) { el.remove(); });
    boxes.forEach(function (b, i) {
      var x = Math.min(b.x0, b.x1), y = Math.min(b.y0, b.y1);
      var w = Math.abs(b.x1 - b.x0);
      var del = document.createElement("div");
      del.className = "box-del";
      del.textContent = "×";
      del.style.left = (x + w - 8) + "px";
      del.style.top = (y - 8) + "px";
      del.title = "Xoá khung #" + (i + 1);
      del.addEventListener("mousedown", function (e) {
        e.stopPropagation();
        boxes.splice(i, 1);
        draw(); emitValue(); setFrameHeight();
      });
      stage.appendChild(del);
    });
  }

  // ----- OCR: 1 o text tu do (mau xanh la) -----
  function openOcrEditor(box, onDone) {
    var x = Math.min(box.x0, box.x1), y = Math.min(box.y0, box.y1);
    var w = Math.max(80, Math.abs(box.x1 - box.x0));
    var wrap = document.createElement("div");
    wrap.className = "box-editor";
    wrap.style.left = x + "px";
    wrap.style.top = (y - 24 >= 0 ? y - 24 : y) + "px";
    var input = document.createElement("input");
    input.className = "box-edit-input";
    input.type = "text";
    input.value = box.text || "";
    input.placeholder = "Chữ trên màn hình…";
    input.style.width = w + "px";
    wrap.appendChild(input);
    stage.appendChild(wrap);
    input.focus(); input.select();

    var done = false;
    function finish() {
      if (done) return;
      done = true;
      box.text = input.value.trim();
      wrap.remove();
      onDone();
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") finish();
      if (e.key === "Escape") finish();
    });
    input.addEventListener("blur", finish);
    wrap.addEventListener("mousedown", function (e) { e.stopPropagation(); });
  }

  // ----- Object: dropdown 514 nhan + o so luong toi thieu (mau vang) -----
  function openObjectEditor(box, onDone) {
    var x = Math.min(box.x0, box.x1), y = Math.min(box.y0, box.y1);
    var wrap = document.createElement("div");
    wrap.className = "box-editor";
    wrap.style.left = x + "px";
    wrap.style.top = (y - 26 >= 0 ? y - 26 : y) + "px";

    var select = document.createElement("select");
    select.className = "box-edit-select";
    var placeholder = document.createElement("option");
    placeholder.value = ""; placeholder.textContent = "— chọn nhãn —";
    select.appendChild(placeholder);
    LABELS.forEach(function (lb) {
      var opt = document.createElement("option");
      opt.value = lb; opt.textContent = lb;
      if (lb === box.label) opt.selected = true;
      select.appendChild(opt);
    });

    var count = document.createElement("input");
    count.className = "box-edit-count";
    count.type = "number"; count.min = "1"; count.value = box.minCount || 1;
    count.title = "Số lượng tối thiểu";

    wrap.appendChild(select);
    wrap.appendChild(count);
    stage.appendChild(wrap);
    select.focus();

    var done = false;
    function finish() {
      if (done) return;
      done = true;
      box.label = select.value;
      box.minCount = Math.max(1, parseInt(count.value, 10) || 1);
      wrap.remove();
      onDone();
    }
    select.addEventListener("change", function () {
      // chon xong nhan -> giu editor mo them chut de nguoi dung chinh so luong neu can, dong
      // khi they click ra ngoai (blur ca 2 o).
    });
    select.addEventListener("keydown", function (e) { if (e.key === "Escape") finish(); });
    count.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === "Escape") finish(); });
    wrap.addEventListener("mousedown", function (e) { e.stopPropagation(); });
    wrap.addEventListener("focusout", function (e) {
      // dong khi focus roi khoi CA 2 o (khong phai chuyen qua lai giua select<->count)
      setTimeout(function () {
        if (!wrap.contains(document.activeElement)) finish();
      }, 0);
    });
  }

  function stageXY(evt) {
    var r = stage.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(W, evt.clientX - r.left)),
      y: Math.max(0, Math.min(H, evt.clientY - r.top)),
    };
  }

  stage.addEventListener("mousedown", function (e) {
    if (e.target !== canvas) return;
    var p = stageXY(e);
    drawing = true;
    curBox = { x0: p.x, y0: p.y, x1: p.x, y1: p.y, kind: mode, text: "", label: "", minCount: 1 };
  });
  window.addEventListener("mousemove", function (e) {
    if (!drawing || !curBox) return;
    var p = stageXY(e);
    curBox.x1 = p.x; curBox.y1 = p.y;
    draw();
  });
  window.addEventListener("mouseup", function () {
    if (!drawing || !curBox) return;
    drawing = false;
    var w = Math.abs(curBox.x1 - curBox.x0), h = Math.abs(curBox.y1 - curBox.y0);
    if (w < 8 || h < 8) { curBox = null; draw(); return; }
    var finished = curBox;
    curBox = null;
    boxes.push(finished);
    draw();
    var onDone = function () { draw(); emitValue(); setFrameHeight(); };
    if (finished.kind === "object") openObjectEditor(finished, onDone);
    else openOcrEditor(finished, onDone);
  });

  modeOcrBtn.addEventListener("click", function () { mode = "ocr"; updateModeButtons(); });
  modeObjectBtn.addEventListener("click", function () { mode = "object"; updateModeButtons(); });

  document.getElementById("undoBtn").addEventListener("click", function () {
    boxes.pop(); draw(); emitValue(); setFrameHeight();
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    boxes = []; draw(); emitValue(); setFrameHeight();
  });

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    var args = (event.data.args) || {};
    if (!initialized) {
      initialized = true;
      W = args.width || W;
      H = args.height || H;
      LABELS = args.labels || [];
      boxes = (args.boxes || []).map(function (b) {
        return {
          x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1, kind: b.kind || "ocr",
          text: b.text || "", label: b.label || "", minCount: b.minCount || 1,
        };
      });
      resize();
      draw();
      setFrameHeight();
    }
  });

  updateModeButtons();
  resize();
  draw();
  componentReady();
  setFrameHeight();
})();
</script>
</body>
</html>
